### 行首如果存在注释符号 "#" 则说明该项 “未启用”
### 文档_ https://github.com/hooke007/MPV_lazy/blob/main/portable_config/mpv.conf
### 注意：当前预设下，选项 --volume --glsl-shaders 的关联属性已被全局追踪记录，移除缓存文#load-scripts = no



 ########d-props.json 才能使其的更改生效

 input-conf = "~~/input_uosc.conf"
 include = "~~/profiles.conf"
 include = "~~/script-opts.conf"
 use-filedir-conf = yes
 log-file = "~~/logs/mpv-lazy.log"

 # 开启弹幕插件日志 (debug级别: trace, debug, v, info, warn, error, fatal)
 #msg-level = uosc_danmaku=debug

 ########
 # 基础 #
 ########

 vo = gpu-next
 gpu-api = d3d11
#gpu-context = winvk
#d3d11-exclusive-fs = yes
#d3d11-flip = no

 hwdec = auto-copy
 hwdec-codecs = h264,hevc,vp8,vp9,ffv1

#d3d11-adapter = "NVIDIA GeForce RTX 2070 Super"
#vulkan-device = "NVIDIA GeForce RTX 2070 Super"


 ########
 # 功能 #
 ########

 idle = yes
 input-ime = no
#input-ipc-server = mpvpipe
 input-builtin-bindings = no
#pause = yes

 target-colorspace-hint = yes

 hr-seek-framedrop = no
 save-position-on-quit = yes
 watch-later-options = start,vid,aid,sid

#autocreate-playlist = same
 directory-mode = ignore

#directory-filter-types = video,audio
#video-exts = avi,flv,m2ts,mkv,mov,mp4,ts,wmv
#image-exts = avif,bmp,jpeg,jpg,jxl,png,webp
#audio-exts = aiff,ape,flac,mp3,ogg,opus,wav

 keep-open = yes
#ontop = yes
#title-bar = no
 autofit-smaller = 50%x50%
 keepaspect-window = no
#auto-window-resize = no
 hidpi-window-scale = no
 
 cache=yes
 cache-secs=1200                      # 前向缓存时间（秒），20分钟
 demuxer-max-bytes = 1024MiB         # 前向缓存大小上限，1GB
 demuxer-max-back-secs=1200           # 后向缓存时间（秒），20分钟
 demuxer-max-back-bytes = 2048MiB    # 后向缓存大小上限，2GB
 icc-cache = yes
 icc-cache-dir = "~~/_cache/icc"
 gpu-shader-cache = yes
 gpu-shader-cache-dir = "~~/_cache/shader"
 watch-later-dir = "~~/_cache/watch_later"




 ########
 # 网络 #
 ########

# 网络超时设置（秒）- 增加网络超时时间以避免过早跳转
 network-timeout = 120

# 当初始化失败时停止播放，而不是自动跳转到下一个文件
 stop-playback-on-init-failure = yes

# 增加缓存暂停等待时间，给网络连接更多时间
 cache-pause-wait = 5

# 增加demuxer终止超时时间
 demuxer-termination-timeout = 3








 #######
 # OSD #
 #######

 osd-on-seek = msg-bar
#osd-blur = 1
 osd-bar-w = 100
 osd-bar-h = 1.8
 osd-bar-align-y = -1
 osd-color = "#672168"
 osd-outline-color = "#EEEEEE"
 osd-outline-size = 0.8
 osd-font-size = 38
 osd-fractions = yes
 osd-playing-msg = "${filename}"
 osd-playlist-entry=both           # <默认 title|filename|both> 指定播放列表显示媒体标题或文件名或显示两者
 osd-duration = 2000
 osd-playing-msg-duration = 3000


 ########
 # 音频 #
 ########

 #ao=wasapi                             # --ao=<driver1,driver2,...[,]> 指定要使用的音频输出驱动程序的优先级列表，如果列表有尾随的 ','，mpv 将回退到未包含在列表中的驱动程序
                                      ## windows 推荐 wasapi；linux 推荐 alsa，需配合参数--audio-channels=auto；macos 推荐 coreaudio 或 coreaudio_exclusive
                                      ## 经测试如果有其他软件独占音频通道后再打开 MPV 画面会无比卡顿
 #audio-device=auto                     # 此项用于指定启动时的音频输出设备
                                      # 改具体值示例 --audio-device="wasapi/{xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}"，设备名获取方式见官方手册
 #audio-exclusive=yes                  # 音频通道独占。如果音频存在卡顿问题可关闭这项或以上一项

 #volume = 100   # 注意：此参数当前在 script-opts.conf 文件中存在关联处理（参见 “保存全局属性并恢复” 部分）
 #volume-max = 130
 #audio-channels=7.1,5.1,stereo         # <默认值 auto-safe|auto|layouts|stereo>，如果双声道系统播放多声道影片时有的声道声音没出现，尝试强制设定为双声道
                                      # 注意：此项必须设置为实际音频输出设备的相关声道值或优先级顺序。mpv 默认的 auto-safe 和 auto 下会出现多声道下混丢声道的问题，不推荐使用
                                      # 示例参数 7.1,5.1,stereo 为常见音频输出设备的优先级顺序，会自动回退选择符合实际音频输出设备的输出值（大多数使用的是 stereo 双声道设备）
                                      # 多声道音轨下混成双声道时，如果觉得背景音过响，角色台词声音小，尝试看看这个：https://github.com/mpv-player/mpv/issues/6563 
                    #alang = chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze
 #audio-file-auto = fuzzy              # <默认 no|exact|fuzzy|all> 指定自动加载外部音轨的方式
                                      ## no：禁用；exact：自动加载含有符合 BCP 47 语言标签语法的扩展名的外部音轨；fuzzy：自动加载包含视频文件名的外部音轨；all：自动加载检测到的所有音轨



########
# 音频 #
########

audio-device=auto                     # 此项用于指定启动时的音频输出设备
                                      # 改具体值示例 --audio-device="wasapi/{xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}"，设备名获取方式见官方手册
audio-channels=7.1,5.1,stereo         # <默认值 auto-safe|auto|layouts|stereo>，如果双声道系统播放多声道影片时有的声道声音没出现，尝试强制设定为双声道
                                      # 注意：此项必须设置为实际音频输出设备的相关声道值或优先级顺序。mpv 默认的 auto-safe 和 auto 下会出现多声道下混丢声道的问题，不推荐使用
                                      # 示例参数 7.1,5.1,stereo 为常见音频输出设备的优先级顺序，会自动回退选择符合实际音频输出设备的输出值（大多数使用的是 stereo 双声道设备）
                                      # 多声道音轨下混成双声道时，如果觉得背景音过响，角色台词声音小，尝试看看这个：https://github.com/mpv-player/mpv/issues/6563 
ao=wasapi                             # --ao=<driver1,driver2,...[,]> 指定要使用的音频输出驱动程序的优先级列表，如果列表有尾随的 ','，mpv 将回退到未包含在列表中的驱动程序
                                      ## windows 推荐 wasapi；linux 推荐 alsa，需配合参数--audio-channels=auto；macos 推荐 coreaudio 或 coreaudio_exclusive
                                      ## 经测试如果有其他软件独占音频通道后再打开 MPV 画面会无比卡顿
#audio-exclusive=yes                  # 音频通道独占。如果音频存在卡顿问题可关闭这项或以上一项
#volume=100                           # 播放器启动音量。0 为静音，默认 100
#volume-max=130                       # <100.0-1000.0> 最大音量。默认值 130（130 的响度约为 100 的两倍 1.3^3≈2）
#audio-pitch-correction=no            # [--af=scaletempo/scaletempo2/rubberband 的前置条件] 变速播放时的音调修正，默认 yes。自动插入前三项音频滤镜中其一（更多信息见滤镜区）
#audio-delay=0.04                     # 如需要，可设置音频延迟
#audio-samplerate=96000               # 强制 resample 成 96kHz，24bit（需要音频设备硬件支持）。注意！并非必要
#audio-format=s32
#audio-normalize-downmix=yes          # 如果环绕声音频下混为立体声，则启用/禁用规格化（默认：no）。如果禁用此功能，下混可能会导致削波。如果启用此功能，则输出可能太安静。这取决于源音频
#replaygain=track                     # <默认 no|track|album> 根据文件元数据中存储的重播增益值调整音量增益
                                      # no: 不执行任何调整;track: 应用轨道增益;album: 如果存在专辑增益，则应用专辑增益，否则回退到曲目增益
#ad-lavc-downmix=yes                  # <yes|默认 no> 是否向解码器请求音频通道缩混。某些解码器（例如 AC-3、AAC 和 DTS）可以在解码时重新混合音频
gapless-audio=no                      # <no|yes|weak 默认> 尝试在文件更改时播放连续的音频文件，而不会静音或中断。默认值 weak: 当音频格式发生变化时初始化音频输出
                                      # 设为 yes 时会导致文件保存相同的采样率致使音质降低
#audio-file-auto-exts=aac,ac3,dts,eac3,flac,m4a,mka,mp3,ogg,opus,thd,wav,wv
                                      # 指定使用"audio-file-auto"选项时尝试匹配的音频文件的扩展名。示例即为默认值
audio-file-auto=fuzzy                 # <默认 no|exact|fuzzy|all> 指定自动加载外部音轨的方式
                                      ## no：禁用；exact：自动加载含有符合 BCP 47 语言标签语法的扩展名的外部音轨；fuzzy：自动加载包含视频文件名的外部音轨；all：自动加载检测到的所有音轨
audio-file-paths=audio;audios;audio 5.1;audios 5.1;audio 7.1;audios 7.1;音轨
                                      # <path1:path2:...> 在指定的额外目录中寻找匹配的音轨，支持相对和绝对路径
                                      ## ":" 在 windows 上使用 ";" 代替
alang=japanese,jpn,jap,ja,jp,english,eng,en
                                      # 设置音轨首选语言，但 MPV 优先加载外挂轨道
#aid=1                                # 暂时无法根据其他的 metadata 选择轨道，mpv 又默认偏好外挂轨道，常常选到不想要的音轨
                                      ## 建议使用 trackselect.lua 脚本实现依据 metadata 自动选择指定音轨 https://github.com/po5/trackselect



 ########
 # 视频 #
 ########

#icc-profile-auto = yes

#target-prim = display-p3
#target-trc = gamma2.2

 video-sync = display-resample
#video-sync-max-video-change = 5
 interpolation = yes
#tscale = sphinx

 cscale = mitchell
 scale=ewa_lanczossharp
 dscale=mitchell
 sigmoid-upscaling = yes
 correct-downscaling = yes
 scale-antiring = 0.5
 dscale-antiring = 0.5
 linear-upscaling = no
 linear-downscaling = no

 dither-depth = auto
#deband = yes
 deinterlace = auto

# HDR色调映射已由hdr-mode.lua脚本智能管理，无需手动设置
#tone-mapping = hable
#gamut-mapping-mode = clip
 hdr-peak-percentile = 99.99


 ####################
 # 脚本 滤镜 着色器 #
 ####################

#load-stats-overlay = no
 osc = no

 ##################
 # yt-dlp 在线视频 #
 ##################
 ## 快捷开关说明：
 ## 1. 启用 yt-dlp：注释掉 "ytdl = no" 这一行（在行首添加 #）
 ## 2. 禁用 yt-dlp：取消注释 "ytdl = no" 这一行（删除行首的 #）
 ## 3. 启用后，取消注释下面需要的选项来配置 yt-dlp 行为

 ytdl = no                                 # <默认 yes> 禁用 yt-dlp 功能，启用请注释此行
ytdl-raw-options-append = cookies-from-browser=edge    # 从浏览器导入 cookies（可选：edge, chrome, firefox 等）
#ytdl-raw-options-append = sub-langs=-danmaku           # 排除弹幕字幕
ytdl-format=bestvideo*+bestaudio/best                  # <ytdl|best|worst|mp4|webm|...> 视频格式/质量选择
                                                        ## bestvideo*+bestaudio/best：优先选择最佳视频+最佳音频，回退到最佳单一格式
                                                        ## 其他常用格式：best (最佳), worst (最差), mp4 (MP4格式), webm (WebM格式)

#load-scripts = no

 ########
 # 字幕 #
 ########

 sub-auto = fuzzy
 sub-file-paths = sub;subtitles
 sub-codepage = GB18030
 slang = chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze
 subs-fallback = yes

#blend-subtitles = yes

 sub-font = "LXGW WenKai Mono"
 sub-font-size = 44
#sub-scale-with-window = no
 sub-scale-signs = yes
 sub-outline-size = 4
 sub-blur = 1
 sub-color = "#FFD766"
#sub-back-color = "#641C1C1C"
#sub-shadow-offset = 2
 sub-use-margins = yes

#sub-ass-use-video-data = aspect-ratio
#sub-ass-video-aspect-override  = 16:9

#sub-ass-override = force
#sub-ass-scale-with-window = yes
 sub-ass-force-margins = yes
#sub-ass-style-overrides = Fontname=LXGW WenKai Mono

#stretch-image-subs-to-screen = yes
#image-subs-video-resolution = yes

 ########
 # 截图 #
 ########

 screenshot-format = png

 screenshot-jpeg-quality = 100
#screenshot-jpeg-source-chroma = no
 screenshot-png-compression = 4
 screenshot-webp-lossless = yes
#screenshot-webp-quality = 100
#screenshot-webp-compression = 0
 screenshot-jxl-distance = 0

 screenshot-tag-colorspace = no
 screenshot-high-bit-depth = no
 screenshot-template = "~~/desktop/MPV-%P-N%n"

