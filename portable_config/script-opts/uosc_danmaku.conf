# ============================================================================
#                        uosc_danmaku 配置文件
# ============================================================================
#
# 项目地址: https://github.com/Tony15246/uosc_danmaku
# 详细说明: 请参阅项目 README.md 中的 "可配置选项" 章节
#
# 使用说明:
#   - 以 # 开头的行为注释，不会生效
#   - 要启用某个选项，请删除行首的 # 号并根据需要修改值
#   - 修改配置后重新打开视频即可生效
#
# ============================================================================


# ============================================================================
# 弹幕加载相关配置
# ============================================================================

# ----------------------------------------------------------------------------
# load_more_danmaku - 全量弹幕源加载开关
# ----------------------------------------------------------------------------
# 功能说明:
#   由于弹弹Play默认对于弹幕较多的番剧加载并整合弹幕的上限大约每集7000条,
#   而这7000条弹幕分配不均匀,有时基本只来自哔哩哔哩,有时又只来自巴哈姆特。
#   开启此选项后,会逐一搜索所有弹幕源下的全部弹幕,并由脚本整合加载。
# 
# 优点: 可获取所有可用弹幕源下的所有弹幕,充分发挥弹弹Play整合全平台弹幕的优势
# 缺点: 对于热门番剧,弹幕数量可能破万,屏幕上弹幕会非常多
# 
# 可选值: yes | no
# 默认值: no
# ----------------------------------------------------------------------------
load_more_danmaku=yes


# ----------------------------------------------------------------------------
# excluded_platforms - 排除指定平台的弹幕源
# ----------------------------------------------------------------------------
# 功能说明:
#   当启用 load_more_danmaku 选项时,可过滤掉不想要的平台弹幕。
#   支持域名关键词匹配,不需要精确匹配完整URL。
# 
# 常见平台:
#   - bilibili.com     (哔哩哔哩/B站)
#   - gamer.com.tw     (巴哈姆特)
#   - acfun.cn         (A站)
#   - iqiyi.com        (爱奇艺)
#   - qq.com           (腾讯视频)
#   - youku.com        (优酷)
# 
# 注意: 
#   - 此选项仅在 load_more_danmaku=yes 时生效
#   - 使用 JSON 数组格式,注意保留方括号和引号
# 
# 格式: ["平台1", "平台2", "平台3"]
# 默认值: []
# ----------------------------------------------------------------------------
#excluded_platforms=["bilibili.com", "gamer.com.tw"]


# ----------------------------------------------------------------------------
# auto_load - 全自动弹幕填装开关
# ----------------------------------------------------------------------------
# 功能说明:
#   记忆型全自动弹幕填装。在为某个文件夹下的某一集番剧加载过一次弹幕后,
#   加载过的弹幕会自动关联到该集。之后每次重新播放该文件就会自动加载弹幕,
#   同时该文件对应的文件夹下的所有其他集数的文件都会在播放时自动加载弹幕,
#   无需再重复手动输入番剧名进行搜索。
# 
# 使用场景示例:
#   文件夹结构:
#     败犬女主太多了/
#       ├── 第01集.mp4
#       ├── 第02集.mp4
#       └── 第03集.mp4
#   
#   只要在播放第01集时手动搜索并加载过一次弹幕,
#   之后播放第02集、第03集时就会自动加载对应集数的弹幕。
# 
# 注意事项:
#   - 一个文件夹下应该只有同一部番剧的视频文件
#   - 如果文件夹中混杂了不同番剧的视频,可能会导致弹幕关联错乱
#   - 开启后还支持通过文件哈希匹配自动加载弹幕(准确率较低)
# 
# 可选值: yes | no
# 默认值: no
# ----------------------------------------------------------------------------
auto_load=no


# ----------------------------------------------------------------------------
# autoload_for_url - URL播放场景自动加载弹幕与关联继承
# ----------------------------------------------------------------------------
# 功能说明:
#   为可能支持的 URL 视频文件实现弹幕关联记忆和继承,配合播放列表食用效果最佳。
#   
# 支持场景:
#   - embyToLocalPlayer: Emby 本地播放器调用
#   - mpv-torrserver: 种子流式播放
#   - tsukimi: Jellyfin/Emby 客户端
#   - Play-With-MPV: 浏览器网络视频播放
#   - ff2mpv: Firefox 扩展网络视频播放
# 
# 自动加载支持:
#   - bilibili.com: 哔哩哔哩视频自动加载弹幕
#   - gamer.com.tw: 巴哈姆特视频自动加载弹幕
#     (播放巴哈姆特视频时若失败,请检查 proxy 选项配置是否正确)
# 
# 可选值: yes | no
# 默认值: no
# ----------------------------------------------------------------------------
autoload_for_url=yes


# ----------------------------------------------------------------------------
# autoload_local_danmaku - 自动加载同目录下的XML弹幕文件
# ----------------------------------------------------------------------------
# 功能说明:
#   自动加载播放文件同目录下同名的 XML 格式弹幕文件。
#   
# 文件命名规则:
#   视频文件: example.mp4
#   弹幕文件: example.xml (必须同名,仅扩展名不同)
# 
# 优先级说明:
#   本功能优先级高于所有其他自动加载弹幕功能。
#   如果同目录存在同名XML文件,将优先加载该文件,忽略其他弹幕源。
# 
# 配合使用:
#   与 save_danmaku 选项配合可实现弹幕自动保存和自动加载的完整流程。
# 
# 可选值: yes | no
# 默认值: no
# ----------------------------------------------------------------------------
autoload_local_danmaku=yes


# ----------------------------------------------------------------------------
# save_danmaku - 自动保存弹幕文件至视频同目录
# ----------------------------------------------------------------------------
# 功能说明:
#   当文件关闭时自动保存弹幕文件(XML格式)至视频同目录,
#   保存的弹幕文件名与对应的视频文件名相同。
# 
# 保存规则:
#   - 保存格式: XML
#   - 文件命名: 与视频文件同名
#   - 保存位置: 视频所在目录
#   - 若存在同名文件则不执行保存(避免覆盖)
# 
# 配合使用:
#   与 autoload_local_danmaku 选项配合可实现:
#   首次播放 → 自动获取弹幕 → 关闭时保存 → 再次播放自动加载本地弹幕
# 
# 运行时控制:
#   可在 input.conf 中添加以下快捷键实时切换此选项:
#   key cycle-values script-opts uosc_danmaku-save_danmaku=yes uosc_danmaku-save_danmaku=no
# 
# 注意事项:
#   如不希望每次都加载之前保存的本地弹幕,请:
#   - 关闭 autoload_local_danmaku 选项
#   - 或转移弹幕文件至其他路径
#   - 或关闭本选项
# 
# 可选值: yes | no
# 默认值: no
# ----------------------------------------------------------------------------
#save_danmaku=no



# ============================================================================
# 弹幕显示相关配置
# ============================================================================

# ----------------------------------------------------------------------------
# opacity - 弹幕透明度
# ----------------------------------------------------------------------------
# 功能说明:
#   设置弹幕的透明度,可用于让弹幕不过分遮挡画面内容。
# 
# 取值范围: 0.0 ~ 1.0
#   - 0.0: 完全透明(看不见)
#   - 1.0: 完全不透明
#   - 0.7: 推荐值,既能看清弹幕又不过分遮挡画面
# 
# 默认值: 0.7
# ----------------------------------------------------------------------------
#opacity=0.7


# ----------------------------------------------------------------------------
# chConvert - 中文简繁体转换
# ----------------------------------------------------------------------------
# 功能说明:
#   转换弹幕中的简体字和繁体字,解决弹幕简繁混杂的问题。
#   可根据个人阅读习惯统一弹幕字体风格。
# 
# 可选值:
#   0 - 不转换(保持原样)
#   1 - 转换为简体中文
#   2 - 转换为繁体中文
# 
# 使用场景:
#   - 观看台湾地区番剧时,繁体弹幕较多,可设为 1 转为简体
#   - 习惯繁体阅读的用户,可设为 2 统一转为繁体
# 
# 默认值: 0
# ----------------------------------------------------------------------------
#chConvert=0


# ----------------------------------------------------------------------------
# merge_tolerance - 合并重复弹幕的时间容差
# ----------------------------------------------------------------------------
# 功能说明:
#   可以合并一定时间段内同时出现的大量重复弹幕,减少刷屏现象。
#   在热门番剧或名场面时,经常会有大量相同内容的弹幕同时出现。
# 
# 可选值:
#   -1: 禁用合并功能
#    0: 只合并同一时间(精确到秒)相同内容的弹幕
#   >0: 合并指定秒数误差内的相同内容弹幕
#       例如设为 1 表示前后1秒内的相同弹幕会被合并
# 
# 使用建议:
#   - 普通场景: -1 (不合并,保留所有弹幕)
#   - 热门番剧: 1 或 2 (合并重复刷屏弹幕)
# 
# 默认值: -1
# ----------------------------------------------------------------------------
#merge_tolerance=-1


# ----------------------------------------------------------------------------
# max_screen_danmaku - 限制屏幕同时显示的弹幕数量
# ----------------------------------------------------------------------------
# 功能说明:
#   限制任意时刻屏幕中同时显示的弹幕数量上限。
#   当值大于0时,脚本会在解析弹幕时智能丢弃部分弹幕,
#   确保屏幕中显示的弹幕不超过设定值,避免弹幕过多影响观看。
# 
# 取值范围:
#    0: 不限制(显示所有弹幕)
#   >0: 限制最大数量,例如 60 表示屏幕上最多同时显示60条弹幕
# 
# 使用建议:
#   - 弹幕较少的视频: 0 (不限制)
#   - 热门番剧/弹幕过多: 50~100 (根据个人喜好调整)
# 
# 默认值: 0
# ----------------------------------------------------------------------------
#max_screen_danmaku=0


# ----------------------------------------------------------------------------
# vf_fps - 使用FPS视频滤镜提升弹幕流畅度
# ----------------------------------------------------------------------------
# 功能说明:
#   使用 fps 视频滤镜可大幅提升弹幕的平滑度和流畅性,
#   让弹幕移动更加顺滑,观看体验更好。
# 
# 性能说明:
#   此视频滤镜的性能开销较大,需要在确保设备性能足够的前提下开启。
#   配置较低的设备开启后可能导致视频卡顿或掉帧。
# 
# 生效条件:
#   - 视频帧率 < 60 fps
#   - 显示器刷新率 >= 60 Hz
#   只有同时满足以上两个条件时才会生效
# 
# 实际效果:
#   会在 mpv 中添加视频滤镜: @danmaku:fps=fps=60/1.001
#   将视频帧率提升至 60fps,使弹幕移动更流畅
# 
# 可选值: yes | no
# 默认值: no
# ----------------------------------------------------------------------------
vf_fps=yes


# ----------------------------------------------------------------------------
# fps - 自定义FPS滤镜参数
# ----------------------------------------------------------------------------
# 功能说明:
#   自定义 fps 滤镜的具体参数,可根据显示器刷新率进行调整。
#   此选项仅在 vf_fps=yes 时生效。
# 
# 常见配置:
#   60/1.001  - 标准 60fps (实际约 59.94fps) [推荐]
#   60/1      - 精确 60fps
#   120/1.001 - 120fps 高刷显示器
#   144/1     - 144fps 电竞显示器
# 
# 配置建议:
#   根据显示器刷新率选择合适的值:
#   - 60Hz 显示器:  60/1.001
#   - 120Hz 显示器: 120/1.001
#   - 144Hz 显示器: 144/1
# 
# 实际生效:
#   例如设置 fps=144/1 时,实际添加的滤镜为:
#   @danmaku:fps=fps=144/1
# 
# 默认值: 60/1.001
# ----------------------------------------------------------------------------
#fps=60/1.001



# ============================================================================
# 弹幕样式相关配置
# ============================================================================

# ----------------------------------------------------------------------------
# scrolltime - 滚动弹幕显示时间
# ----------------------------------------------------------------------------
# 功能说明:
#   设置滚动弹幕(从右向左移动的弹幕)在屏幕上显示的时间。
#   时间越长,弹幕移动越慢;时间越短,弹幕移动越快。
# 
# 取值范围: 正整数,单位为秒
# 
# 使用建议:
#   - 弹幕较少: 12~15 秒 (慢速,有充分时间阅读)
#   - 弹幕适中: 10~12 秒 (标准速度)
#   - 弹幕较多: 8~10 秒  (快速,避免重叠)
# 
# 默认值: 15
# ----------------------------------------------------------------------------
scrolltime=15


# ----------------------------------------------------------------------------
# fixtime - 固定弹幕显示时间
# ----------------------------------------------------------------------------
# 功能说明:
#   设置固定位置弹幕(顶部弹幕和底部弹幕)在屏幕上停留的时间。
#   这类弹幕不会移动,只是在指定位置显示一段时间后消失。
# 
# 取值范围: 正整数,单位为秒
# 
# 使用建议:
#   - 3~5 秒: 标准停留时间
#   - 5~8 秒: 适合阅读较长的固定弹幕
# 
# 默认值: 5
# ----------------------------------------------------------------------------
fixtime=5


# ----------------------------------------------------------------------------
# fontname - 弹幕字体
# ----------------------------------------------------------------------------
# 功能说明:
#   设置弹幕使用的字体名称。
# 
# 注意事项:
#   - 字体名称两边不需要使用引号 "" 括住
#   - 需要确保系统中已安装指定的字体
#   - 如果字体不存在,将使用系统默认字体
# 
# 常用字体推荐:
#   - sans-serif        (默认无衬线字体)
#   - 微软雅黑           (Windows 简体中文)
#   - Microsoft YaHei   (Windows 简体中文)
#   - 黑体              (简体中文)
#   - SimHei            (简体中文黑体)
#   - Noto Sans CJK SC  (思源黑体简体)
#   - Arial             (英文)
# 
# 默认值: sans-serif
# ----------------------------------------------------------------------------
fontname=sans-serif


# ----------------------------------------------------------------------------
# fontsize - 弹幕字体大小
# ----------------------------------------------------------------------------
# 功能说明:
#   设置弹幕文字的大小。
# 
# 取值范围: 正整数
# 
# 使用建议:
#   根据视频分辨率和个人喜好调整:
#   - 720p 视频:  35~45
#   - 1080p 视频: 45~55
#   - 2K 视频:    55~65
#   - 4K 视频:    70~90
# 
# 默认值: 50
# ----------------------------------------------------------------------------
fontsize=50


# ----------------------------------------------------------------------------
# shadow - 弹幕阴影
# ----------------------------------------------------------------------------
# 功能说明:
#   为弹幕文字添加阴影效果,可提升文字在亮色画面中的可读性。
# 
# 取值范围: 0 ~ 4
#   0: 无阴影
#   1~4: 阴影强度逐渐增加
# 
# 默认值: 0
# ----------------------------------------------------------------------------
shadow=0


# ----------------------------------------------------------------------------
# bold - 弹幕粗体
# ----------------------------------------------------------------------------
# 功能说明:
#   设置弹幕文字是否使用粗体显示。
#   粗体可提升弹幕的可读性和视觉冲击力。
# 
# 可选值: yes | no
# 
# 默认值: yes
# ----------------------------------------------------------------------------
bold=yes


# ----------------------------------------------------------------------------
# displayarea - 弹幕显示区域
# ----------------------------------------------------------------------------
# 功能说明:
#   设置弹幕在画面中的垂直显示范围(从顶部开始计算)。
#   可用于防止弹幕遮挡画面底部的字幕。
# 
# 取值范围: 0.0 ~ 1.0
#   0.0: 不显示弹幕
#   0.5: 只在画面上半部分显示弹幕
#   0.85: 在画面顶部 85% 的区域显示弹幕(为底部字幕留出空间)
#   1.0: 在整个画面中显示弹幕
# 
# 使用建议:
#   - 有内嵌字幕: 0.75~0.85 (为字幕留出空间)
#   - 外挂字幕:   0.80~0.90 (根据字幕位置调整)
#   - 无字幕:     0.95~1.0  (充分利用画面)
# 
# 默认值: 0.85
# ----------------------------------------------------------------------------
displayarea=0.25


# ----------------------------------------------------------------------------
# outline - 弹幕描边
# ----------------------------------------------------------------------------
# 功能说明:
#   为弹幕文字添加描边(轮廓线),提升弹幕在各种背景下的可读性。
#   描边能让弹幕文字与背景画面更好地区分开。
# 
# 取值范围: 0 ~ 4
#   0: 无描边
#   1: 细描边(推荐)
#   2: 中等描边
#   3: 粗描边
#   4: 很粗描边
# 
# 使用建议:
#   - 一般场景: 1 或 2
#   - 画面复杂/色彩丰富: 2 或 3
# 
# 默认值: 1
# ----------------------------------------------------------------------------
outline=1


# ----------------------------------------------------------------------------
# blacklist_path - 弹幕屏蔽词文件路径
# ----------------------------------------------------------------------------
# 功能说明:
#   指定弹幕屏蔽词文件的路径,用于过滤不想看到的弹幕内容。
#   支持使用 Lua 正则表达式进行高级匹配。
# 
# 文件格式:
#   - 每行一个屏蔽词或正则表达式
#   - 支持 Lua 正则表达式语法
#   - 空行和 # 开头的行会被忽略
# 
# 路径说明:
#   - 支持绝对路径: C:\Users\用户名\黑名单.txt
#   - 支持相对路径: 相对于 mpv 配置目录
#   - 支持 ~~ 符号: 代表 mpv 配置目录
# 
# 示例文件内容 (black.txt):
#   # 这是注释
#   广告
#   刷屏.*
#   %d%d%d%d%d%d    # 匹配纯数字弹幕
# 
# 正则表达式示例:
#   ^弹幕.*         # 匹配以"弹幕"开头的所有内容
#   .*广告.*        # 匹配包含"广告"的所有内容
#   %d+            # 匹配纯数字
# 
# 默认值: 空(不启用屏蔽功能)
# ----------------------------------------------------------------------------
#blacklist_path=



# ============================================================================
# 弹幕解析服务相关配置
# ============================================================================

# ----------------------------------------------------------------------------
# api_server - 自定义弹幕API服务地址
# ----------------------------------------------------------------------------
# 功能说明:
#   允许自定义弹幕 API 的服务地址,可使用第三方兼容服务。
#   默认使用弹弹Play官方API,一般情况下无需修改。
# 
# 兼容服务:
#   请确保自定义服务的 API 与弹弹Play兼容。
#   已知兼容的服务:
#   - misaka_danmu_server: https://github.com/l429609201/misaka_danmu_server
#   - danmu_api: https://github.com/huangxd-/danmu_api
# 
# 使用场景:
#   - 使用自建弹幕服务器
#   - 使用第三方弹幕API镜像
#   - 官方API访问受限时的备用方案
# 
# 格式: https://域名或IP:端口
# 默认值: https://api.dandanplay.net
# ----------------------------------------------------------------------------
api_server=http://8.137.8.172:7768/api/v1/jMqK49hDbuLh7NsEkTVP


# ----------------------------------------------------------------------------
# fallback_server - 兜底弹幕服务器地址
# ----------------------------------------------------------------------------
# 功能说明:
#   自定义 B站 和 爱腾优(爱奇艺/腾讯/优酷) 的弹幕获取的兜底服务器地址。
#   主要用于获取非动画弹幕(电影、电视剧、综艺等)。
# 
# 触发条件:
#   只有在弹弹Play API无法解析视频源对应弹幕的情况下才会使用。
#   作为备用方案,提升弹幕获取成功率。
# 
# 自托管说明:
#   兜底弹幕服务器可以自行部署,部署方法参考:
#   https://github.com/lyz05/danmaku
# 
# 注意事项:
#   除非你自行部署了弹幕服务器,否则不建议修改此选项。
#   默认服务器已能满足大部分使用需求。
# 
# 格式: https://域名或IP:端口
# 默认值: https://fc.lyz05.cn
# ----------------------------------------------------------------------------
fallback_server=https://fc.lyz05.cn


# ----------------------------------------------------------------------------
# tmdb_api_key - TMDB API密钥
# ----------------------------------------------------------------------------
# 功能说明:
#   设置 TMDB (The Movie Database) 的 API Key,
#   用于获取非动画条目(电影、电视剧等)的中文信息。
# 
# 使用场景:
#   当搜索内容为非中文时,会调用 TMDB API 获取对应的中文标题和信息,
#   提升弹幕匹配的准确性。
# 
# 获取方法:
#   1. 访问 https://www.themoviedb.org 注册账号
#   2. 进入个人账号设置页面
#   3. 在 API 设置中申请 API Key
#   4. 将获取的 API Key 进行 Base64 编码
#   5. 填写编码后的值
# 
# 编码示例:
#   原始 API Key: abcd1234efgh5678
#   Base64 编码后: YWJjZDEyMzRlZmdoNTY3OA==
# 
# 注意事项:
#   - 不设置此选项时会使用专为本项目申请的公共API Key
#   - 自定义时必须进行 Base64 编码
#   - 公共API Key可能存在请求频率限制
# 
# 默认值: NmJmYjIxOTZkNzIyN2UyMTIzMGM3Y2YzZjQ4MDNkZGM= (项目公共Key)
# ----------------------------------------------------------------------------
tmdb_api_key=MTU5MWU4MzVkNmI5MGY1NWYzNWIyNjhiMjE3NjA0ZWY=



# ============================================================================
# 插件高级配置
# ============================================================================

# ----------------------------------------------------------------------------
# user_agent - 自定义User-Agent
# ----------------------------------------------------------------------------
# 功能说明:
#   自定义 curl 发送网络请求时使用的 User-Agent 字符串。
#   User-Agent 用于标识客户端身份,影响服务器的响应行为。
# 
# 格式要求:
#   User-Agent 格式必须符合弹弹Play的标准,否则无法成功请求。
#   具体格式要求见: 
#   https://github.com/kaedei/dandanplay-libraryindex/blob/master/api/OpenPlatform.md#5user-agent
# 
# 使用场景:
#   1. 提高URL播放的哈希匹配成功率
#      将此项设为 "mpv" 或浏览器的User-Agent可能提高匹配率
#   
#   2. 自定义客户端标识
#      如需标识特定的客户端版本或来源
# 
# 常用配置:
#   mpv_danmaku/1.0              # 默认值(推荐)
#   mpv                          # 模拟 mpv 播放器
#   Mozilla/5.0 (Windows NT...) # 模拟浏览器
# 
# 注意事项:
#   - 此值不可为空
#   - 错误的格式可能导致API请求失败
# 
# 默认值: mpv_danmaku/1.0
# ----------------------------------------------------------------------------
#user_agent=mpv_danmaku/1.0


# ----------------------------------------------------------------------------
# proxy - 网络代理设置
# ----------------------------------------------------------------------------
# 功能说明:
#   自定义 curl 发送网络请求时使用的代理服务器。
#   在某些网络环境下,可能需要通过代理才能访问弹幕服务器。
# 
# 使用场景:
#   1. 访问国外弹幕源(如巴哈姆特)
#      播放巴哈姆特视频时若弹幕加载失败,可能需要配置代理
#   
#   2. 网络受限环境
#      公司/学校网络限制时可通过代理访问
#   
#   3. 特殊网络环境
#      需要经过特定网关的网络环境
# 
# 格式: IP地址:端口 或 域名:端口
# 
# 配置示例:
#   127.0.0.1:7890       # 本地代理(常见代理软件默认端口)
#   127.0.0.1:1080       # SOCKS代理
#   proxy.example.com:8080  # 远程代理服务器
# 
# 支持的代理类型:
#   - HTTP/HTTPS 代理
#   - SOCKS5 代理
# 
# 默认值: 空(不使用代理)
# ----------------------------------------------------------------------------
#proxy=127.0.0.1:7890


# ----------------------------------------------------------------------------
# message_x - 提示信息X轴位置
# ----------------------------------------------------------------------------
# 功能说明:
#   自定义插件相关提示信息的显示位置(水平方向)。
#   设置提示信息距离屏幕左上角的 X 轴(横向)距离。
# 
# 取值范围: 正整数,单位为像素
# 
# 使用场景:
#   - 避免提示信息与其他UI元素重叠
#   - 根据个人习惯调整提示信息位置
#   - 在超宽屏幕上调整显示位置
# 
# 配置建议:
#   - 普通1080p屏幕: 20~50
#   - 2K/4K 屏幕: 50~100
#   - 超宽屏: 根据实际情况调整
# 
# 默认值: 30
# ----------------------------------------------------------------------------
#message_x=30


# ----------------------------------------------------------------------------
# message_y - 提示信息Y轴位置
# ----------------------------------------------------------------------------
# 功能说明:
#   自定义插件相关提示信息的显示位置(垂直方向)。
#   设置提示信息距离屏幕左上角的 Y 轴(纵向)距离。
# 
# 取值范围: 正整数,单位为像素
# 
# 使用场景:
#   - 避免提示信息与标题栏、进度条等重叠
#   - 根据窗口模式/全屏模式调整
#   - 配合 uosc 等UI框架调整位置
# 
# 配置建议:
#   - 窗口模式: 30~60 (避开标题栏)
#   - 全屏模式: 20~40
#   - 与 uosc 配合: 60~100 (避开 uosc 的顶栏)
# 
# 默认值: 30
# ----------------------------------------------------------------------------
#message_y=30


# ----------------------------------------------------------------------------
# title_replace - 文件标题解析自定义规则
# ----------------------------------------------------------------------------
# 功能说明:
#   自定义文件标题解析中的额外替换规则,用于提取视频文件名中的关键信息。
#   当自动识别番剧名称不准确时,可通过此选项自定义解析规则。
# 
# 格式说明:
#   - 内容格式为 JSON 字符串
#   - 替换模式使用 Lua 的 string.gsub 函数
#   - 只支持形如 %n 的捕获组写法(Lua pattern)
#   - 不支持直接字符串替换写法
# 
# 配置示例:
#   [{"rules":[
#     { "^〔(.-)〕": "%1" },           # 提取〔〕中的内容
#     { "^.*《(.-)》": "%1" },         # 提取《》中的内容
#     { "^%[(.-)%]": "%1" },           # 提取[]中的内容
#     { "^(.-)%[.*%]$": "%1" }         # 删除结尾的[...]
#   ]}]
# 
# Lua Pattern 说明:
#   ^   - 字符串开头
#   $   - 字符串结尾
#   .-  - 最短匹配任意字符
#   .*  - 最长匹配任意字符
#   %n  - 第n个捕获组
#   %[  - 转义 [ 字符
#   %]  - 转义 ] 字符
# 
# 使用场景:
#   - 文件名包含特殊格式(如【】《》等)
#   - 需要去除字幕组名称
#   - 需要提取括号中的内容
#   - 标题识别不准确需要自定义规则
# 
# 默认值: 空(使用默认解析规则)
# ----------------------------------------------------------------------------
#title_replace=


# ----------------------------------------------------------------------------
# excluded_path - 哈希匹配排除路径
# ----------------------------------------------------------------------------
# 功能说明:
#   指定哈希匹配功能中需要忽略的共享盘、挂载盘或特定目录的路径。
#   在这些路径下的视频文件不会进行哈希计算,避免性能问题。
# 
# 使用场景:
#   1. 网络共享盘/NAS
#      网络盘哈希计算速度慢,可能导致卡顿
#   
#   2. 挂载的远程存储
#      如 SMB、NFS 挂载点
#   
#   3. 大容量机械硬盘
#      避免频繁读取导致硬盘唤醒
#   
#   4. 临时下载目录
#      不需要为临时文件计算哈希
# 
# 路径格式:
#   - 支持绝对路径和相对路径
#   - 支持盘符(Windows): ["X:", "Z:"]
#   - 支持目录路径: ["F:/Download/", "Download"]
#   - 多个路径用逗号分隔
#   - 使用 JSON 数组格式
# 
# 配置示例:
#   ["X:", "Z:", "F:/Download/", "Download"]
#   
#   Windows示例:
#   ["\\\\NAS\\Videos", "Z:", "D:\\Temp\\"]
#   
#   Linux示例:
#   ["/mnt/nas", "/media/usb", "/tmp"]
# 
# 默认值: 空(不排除任何路径)
# ----------------------------------------------------------------------------
#excluded_path=


# ----------------------------------------------------------------------------
# history_path - 弹幕关联历史记录文件路径
# ----------------------------------------------------------------------------
# 功能说明:
#   指定弹幕关联历史记录文件的保存路径。
#   此文件记录了视频文件与弹幕的关联关系,用于实现自动加载功能。
# 
# 路径格式:
#   - 支持绝对路径: C:\Users\用户名\弹幕历史.json
#   - 支持相对路径: 相对于 mpv 配置目录
#   - 支持 ~~ 符号: 代表 mpv 配置目录
# 
# 使用场景:
#   1. 自定义存储位置
#      将历史记录保存到其他目录(如云同步文件夹)
#   
#   2. 多设备同步
#      通过云盘同步弹幕关联记录到多台设备
#   
#   3. 备份管理
#      方便单独备份和管理弹幕历史记录
# 
# 配置示例:
#   ~~/danmaku-history.json                    # 默认位置
#   ~~/backup/danmaku-history.json             # 子目录
#   C:\Users\用户名\Dropbox\danmaku.json        # 云同步
#   /home/user/.config/mpv/danmaku.json        # Linux绝对路径
# 
# 注意事项:
#   - 确保指定的目录存在且有写入权限
#   - 不要将路径设置到只读位置
#   - 建议定期备份此文件
# 
# 默认值: ~~/danmaku-history.json (mpv配置文件夹根目录)
# ----------------------------------------------------------------------------
#history_path=~~/danmaku-history.json



# ============================================================================
# 快捷键配置
# ============================================================================
#
# 说明:
#   以下快捷键配置的优先级低于 input.conf 中的配置。
#   如果在 input.conf 中已经绑定了相应的快捷键,则此处的设置不会生效。
#   
#   推荐使用 input.conf 进行快捷键配置,此处仅作为备用方案。
#
# ============================================================================

# ----------------------------------------------------------------------------
# open_search_danmaku_menu_key - 弹幕搜索菜单快捷键
# ----------------------------------------------------------------------------
# 功能说明:
#   绑定快捷键用于打开弹幕搜索菜单。
#   在菜单中可以搜索并选择要加载的弹幕。
# 
# 功能特性:
#   - 搜索弹弹Play数据库中的番剧
#   - 显示搜索结果供用户选择
#   - 选择后自动加载对应集数的弹幕
# 
# 快捷键格式:
#   - 单键: a, b, c, 1, 2, 3
#   - 组合键: Ctrl+d, Alt+s, Shift+f
#   - 功能键: F1, F2, ...
# 
# 在 input.conf 中配置(推荐):
#   Ctrl+d script-message open_search_danmaku_menu
# 
# 默认值: Ctrl+d
# ----------------------------------------------------------------------------
#open_search_danmaku_menu_key=Ctrl+d


# ----------------------------------------------------------------------------
# show_danmaku_keyboard_key - 弹幕开关快捷键
# ----------------------------------------------------------------------------
# 功能说明:
#   绑定快捷键用于切换弹幕的显示/隐藏状态。
#   快速开关弹幕,不影响已加载的弹幕数据。
# 
# 功能特性:
#   - 快速切换弹幕显示状态
#   - 不会卸载弹幕,再次开启时无需重新加载
#   - 状态会被记忆,下次播放时保持上次的开关状态
# 
# 使用场景:
#   - 观看精彩片段时临时关闭弹幕
#   - 弹幕过多影响观看时快速隐藏
#   - 需要截图时临时关闭弹幕
# 
# 快捷键格式:
#   - 单键: j, k, d
#   - 组合键: Ctrl+j, Alt+d
# 
# 在 input.conf 中配置(推荐):
#   j script-message show_danmaku_keyboard
# 
# 默认值: j
# ----------------------------------------------------------------------------
#show_danmaku_keyboard_key=j


